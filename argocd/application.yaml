apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asterism
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Matilde-rad/asterism
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: asterism
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
